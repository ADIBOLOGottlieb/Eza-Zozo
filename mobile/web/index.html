<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Base de l'adresse : remplacée par `flutter build web --base-href /chemin/`
    (ex. /Eza-Zozo/ pour GitHub Pages). Elle doit commencer et finir par « / ».
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Eza Zozo : suivi des restaurants, commandes, caisse et rapports, sur PC, tablette et smartphone.">
  <meta name="theme-color" content="#831219">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Eza Zozo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Eza Zozo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Écran de chargement aux couleurs du restaurant, le temps que l'application démarre. */
    body { margin: 0; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) { body { background: #1A1112; } }
    #chargement { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; font-family: system-ui, sans-serif; color: #831219; }
    #chargement img { width: 96px; height: 96px; border-radius: 50%; }
  </style>
</head>
<body>
  <div id="chargement">
    <img src="icons/Icon-192.png" alt="">
    <div>Chargement…</div>
  </div>
  <script>
    // Retire l'écran de chargement dès que Flutter a dessiné sa première image.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('chargement');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
