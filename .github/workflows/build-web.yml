# Version web (PC, tablette, smartphone) publiée sur GitHub Pages : le propriétaire suit tous ses restaurants
# depuis un navigateur, sans rien installer.
# Une fois : GitHub → Settings → Pages → Source : « GitHub Actions ».
# Adresse obtenue : https://<compte>.github.io/<dépôt>/ (ex. https://adibologottlieb.github.io/Eza-Zozo/).
# Se lance à chaque push sur main qui touche l'app, ou à la main (onglet « Actions » → « Build Web » → « Run workflow »).
name: Build Web

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-web.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API"
        required: true
        default: "https://eza-zozo-api-5fib.onrender.com"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Base de l'adresse = nom du dépôt (GitHub Pages sert le site sous /<dépôt>/).
      - name: flutter build web
        env:
          API_URL: ${{ github.event.inputs.api_url || 'https://eza-zozo-api-5fib.onrender.com' }}
        run: |
          flutter build web --release --no-wasm-dry-run \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --dart-define=API_URL="$API_URL"
          # Lien direct vers une page de l'app (rechargement, favori) : GitHub Pages renvoie 404.html.
          cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
